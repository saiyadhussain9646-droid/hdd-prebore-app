<!DOCTYPE html>
<html lang="hi" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Microtunneling Thrust Wall Calculator</title>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--bg3:#eef1f5;--bd:#d6dce6;--ac:#2563eb;--ok:#15803d;--wn:#b45309;--tx:#16181d;--t2:#4b5563;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a0e1a;--panel:#161e35;--bg3:#141b32;--bd:#1e2d54;--ac:#00d4ff;--ok:#00ff88;--wn:#ffcc00;--tx:#c8d8f0;--t2:#7a9cc8}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a0e1a;--panel:#161e35;--bg3:#141b32;--bd:#1e2d54;--ac:#00d4ff;--ok:#00ff88;--wn:#ffcc00;--tx:#c8d8f0;--t2:#7a9cc8}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Noto Naskh Arabic",sans-serif;padding:14px;line-height:1.5}
.c{max-width:600px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
h1{font-size:16px;color:var(--ac)}.hd p{font-size:11px;color:var(--t2)}
.ct{display:flex;gap:6px}
.b,select,input{font:inherit;color:var(--tx);background:var(--bg3);border:1px solid var(--bd);border-radius:9px}
.b{padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;background:var(--panel)}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.ctt{font-size:13px;font-weight:700;color:var(--ac);margin-bottom:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px}.f.w{grid-column:span 2}
label{font-size:12px;font-weight:600;color:var(--t2)}
input,select{width:100%;padding:10px 12px;font-size:15px;font-weight:600}
.calc{width:100%;padding:14px;margin-top:14px;border:0;border-radius:11px;background:var(--ac);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.st{padding:12px;border-radius:10px;font-weight:800;font-size:14px;text-align:center;margin-bottom:12px;border:1px solid}
.p{color:var(--ok);border-color:var(--ok)}.k{color:var(--wn);border-color:var(--wn)}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.rb{background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:12px}
.rl{font-size:12px;color:var(--t2)}.rv{font-size:18px;font-weight:800;color:var(--ac)}.rs{font-size:11px;color:var(--t2)}
.nt{font-size:11px;color:var(--t2);background:var(--bg3);padding:10px;border-radius:8px;border-inline-start:3px solid var(--wn);margin-top:10px}
body{background:radial-gradient(circle at 20% 0,color-mix(in srgb,var(--ac) 16%,var(--bg)),var(--bg) 55%) fixed}
.card{box-shadow:0 6px 22px rgba(0,0,0,.18);border-top:3px solid var(--ac)}
.g{align-items:end}
.f label{min-height:2.8em;display:flex;align-items:flex-end;gap:7px;line-height:1.3}
#gi{counter-reset:n}
#gi .f label::before{counter-increment:n;content:counter(n);flex:none;width:20px;height:20px;border-radius:50%;background:var(--ac);color:var(--bg);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.g input,.g select{height:50px}
.calc{color:var(--bg);box-shadow:0 6px 16px rgba(37,99,235,.35);letter-spacing:.5px}
.rb{border-inline-start:3px solid var(--ac)}
.st{font-size:15px;box-shadow:0 0 14px -4px currentColor}
details summary{cursor:pointer;font-weight:800;color:var(--ac);font-size:14px}
.gt{margin-top:12px;font-size:13px}.gt div{margin-bottom:11px}.gt b{color:var(--ac)}
input::placeholder{color:var(--t2);opacity:.55;font-weight:400}
#rp{display:none}
@media print{body>.c{display:none!important}#rp{display:block}body{background:#fff!important;padding:0}#rp,#rp *{color:#000!important;background:#fff!important}#rp table{width:100%;border-collapse:collapse;margin-bottom:12px}#rp td{border:1px solid #888;padding:6px 8px;font-size:13px}#rp h3{margin:12px 0 6px;font-size:14px}.ps{border:2px solid #000;padding:8px;font-weight:700;text-align:center;margin:12px 0}.pt{font-size:11px;margin-top:14px}}
#lang{width:auto;min-width:104px;padding:6px 26px 6px 10px}#wn{border-color:var(--wn);color:var(--wn)}
</style>
</head>
<body>
<div class="c">
<div class="hd">
<div><h1 data-k="title"></h1><p data-k="sub"></p></div>
<div class="ct"><select id="lang" class="b" onchange="setLang(this.value)"><option value="hi">हिन्दी</option><option value="en">English</option><option value="ar">العربية</option></select><button class="b" onclick="theme()">☀/🌙</button></div>
</div>
<div class="card">
<div class="ctt" data-k="inT"></div>
<div class="g" id="gi">
<div class="f"><label data-k="jack"></label><div style="display:flex;gap:6px"><input type="text" id="jk" data-p="600" inputmode="decimal"><select id="ju" style="width:84px"><option value="t">t</option><option value="kn">kN</option></select></div></div>
<div class="f"><label data-k="w"></label><input type="text" id="W" data-p="4" step="0.1" inputmode="decimal"></div>
<div class="f"><label data-k="h"></label><input type="text" id="H" data-p="3.5" step="0.1" inputmode="decimal"></div>
<div class="f"><label data-k="z"></label><input type="text" id="Z" data-p="3" step="0.5" inputmode="decimal"></div>
<div class="f"><label data-k="soil"></label><select id="soil" onchange="cust()"><option value="sd" data-k="s1"></option><option value="sm" selected data-k="s2"></option><option value="gr" data-k="s3"></option><option value="cs" data-k="s4"></option><option value="cf" data-k="s5"></option><option value="cu" data-k="s6"></option></select></div>
<div class="f"><label data-k="gw"></label><input type="text" id="gw" data-p="2.5" step="0.5" inputmode="decimal"></div>
<div class="f"><label data-k="plate"></label><input type="text" id="pl" data-p="1.5" step="0.1" inputmode="decimal"></div>
<div class="f"><label data-k="conc"></label><select id="fck"><option value="30">M30</option><option value="35" selected>M35</option><option value="40">M40</option></select></div>
</div>
<div class="g" id="cx" style="display:none;margin-top:12px">
<div class="f"><label data-k="phi"></label><input type="text" id="cp" data-p="30" inputmode="decimal"></div>
<div class="f"><label data-k="cn"></label><input type="text" id="cc" data-p="0" inputmode="decimal"></div>
<div class="f w"><label data-k="gam"></label><input type="text" id="cg" data-p="18" inputmode="decimal"></div>
</div>
<button class="calc" onclick="calc()" data-k="calc"></button>
</div>
<div class="card" id="rc" style="display:none">
<div class="ctt" data-k="outT"></div>
<div id="sb" class="st p"></div>
<div class="rg">
<div class="rb"><div class="rl" data-k="load"></div><div class="rv" id="r1"></div><div class="rs" id="r1b"></div></div>
<div class="rb"><div class="rl" data-k="cap"></div><div class="rv" id="r2"></div><div class="rs" id="r2b"></div></div>
<div class="rb"><div class="rl" data-k="fos"></div><div class="rv" id="r3"></div><div class="rs" data-k="fosT"></div></div>
<div class="rb"><div class="rl" data-k="thk"></div><div class="rv" id="r4"></div><div class="rs" data-k="thkS"></div></div>
</div>
<div class="nt" id="asm" style="margin:0 0 10px;display:none"></div>
<div class="nt" id="wn" style="margin:0 0 10px;display:none"></div>
<div class="nt" id="bs" style="margin:0 0 10px"></div>
<div class="f" style="margin:10px 0"><label data-k="pn"></label><input type="text" id="pn"></div>
<div class="g" style="margin-bottom:10px"><button class="b" style="padding:12px" onclick="pdf()" data-k="pdf"></button><button class="b" style="padding:12px" onclick="xls()" data-k="xls"></button></div>
<button class="b" style="width:100%;padding:10px" onclick="copyR()" id="cb"></button>
<div class="nt" data-k="note"></div>
</div>
<details class="card" open><summary id="gs"></summary><div class="gt" id="gl"></div><button class="b" style="width:100%;padding:10px" onclick="copyG()" id="gc"></button></details>
</div>
<div id="rp"></div>

hi:{t:"📖 क्विक गाइड: किस बॉक्स में क्या डालें",cp:"📋 गाइड कॉपी करें",e:"सिर्फ़ बॉक्स 1 ज़रूरी है; बाकी खाली रहने पर ऐप अपने-आप सामान्य मान ले लेगा (दीवार की चौड़ाई अपने-आप निकलेगी)। सब भरकर 'गणना करें' दबाएँ। हरा PASS = मिट्टी की ताकत ठीक है। पीला CHECK = दीवार बड़ी करें या मिट्टी सुधारें।",i:[
["अधिकतम जैक क्षमता (टन)","मशीन के मुख्य जैक की कुल अधिकतम ताकत टन में लिखें। यह मशीन की स्पेसिफ़िकेशन शीट में मिलती है। बगल के बॉक्स से t (टन) या kN चुनें, ऐप खुद बदल लेगा। उदाहरण: 600"],
["दीवार की चौड़ाई (मी)","लॉन्च शाफ़्ट में बैक वॉल की चौड़ाई मीटर में डालें, यानी दीवार का जितना हिस्सा मिट्टी को दबाएगा। उदाहरण: 4"],

en:{t:"📖 Quick guide: what to enter in each box",cp:"📋 Copy guide",e:"Only box 1 is required; empty boxes use standard default values (the wall width is calculated automatically). Fill what you know and press CALCULATE. Green PASS = soil resistance is adequate. Yellow CHECK = enlarge the wall or improve the ground.",i:[

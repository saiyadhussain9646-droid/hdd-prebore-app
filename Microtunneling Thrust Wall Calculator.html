["अधिकतम जैक क्षमता","मशीन के जैक ज़्यादा से ज़्यादा जितना धक्का दे सकते हैं, उसकी कुल ताकत। बैक वॉल को यही लोड सहना है।","मशीन की स्पेसिफ़िकेशन शीट या मैनुअल (थ्रस्ट फ़ोर्स)। बॉक्स के दाएँ बटन से Ton, kN या kip चुनें (1 Ton = 9.81 kN)।","DZ1811 मशीन: 2 सिलेंडर × 2000 kN = 4000 kN (लगभग 408 Ton); मैनुअल पेज 28 (छपा पेज 27); स्ट्रोक 3000 मिलीमीटर।","यह बॉक्स ज़रूरी है। खाली हो तो कोई गणना नहीं होती।","कोई नहीं।","कोई नतीजा नहीं मिलता।","नतीजा आपकी असली मशीन के लिए आता है।","मशीन की अधिकतम क्षमता डालें, काम के दबाव वाली कम वैल्यू नहीं; कम वैल्यू से झूठा भरोसा मिलता है।"],
["दीवार की चौड़ाई","बैक वॉल की चौड़ाई, यानी दीवार का जितना हिस्सा बगल से बगल तक मिट्टी को दबाता है।","शाफ़्ट की ड्रॉइंग या शाफ़्ट का स्ट्रक्चरल डिज़ाइन। गोल शाफ़्ट में पूरा व्यास काम की चौड़ाई नहीं होता (बॉक्स 9 देखें); मशीन ड्रॉइंग में रिएक्शन ब्रैकेट लगभग 1980 मिलीमीटर चौड़ा है (कुल 2090)।","4 मीटर","अगर बॉक्स 9 भरा है तो वही चौड़ाई। नहीं तो: ऊँचाई भी खाली हो तो ऐप 3, 4, 5, 6 मीटर के विकल्प दिखाता है; ऊँचाई भरी हो तो ज़रूरी चौड़ाई निकालता है।","तुरंत पता चल जाता है कि कौन सा साइज़ चलेगा।","ऐप की चुनी चौड़ाई आपके शाफ़्ट में न आए, ऐसा हो सकता है।","नतीजा आपकी असली दीवार का होता है।","गलत चौड़ाई से सेफ़्टी फ़ैक्टर गलत आता है; ड्रॉइंग देखनी पड़ेगी।"],
["दीवार की ऊँचाई","बैक वॉल की नीचे से ऊपर तक की खड़ी ऊँचाई।","शाफ़्ट ड्रॉइंग और स्ट्रक्चरल डिज़ाइन (दीवार का ऊपरी और निचला लेवल)। मशीन का ब्रैकेट लगभग 1.2 मीटर ऊँचा है (ड्रॉइंग से मेरा अंदाज़ा, जाँच लें); वह सिर्फ़ दबाव वाला हिस्सा है, पूरी दीवार नहीं।","3.5 मीटर","ऐप चौड़ाई के हिसाब से ज़रूरी ऊँचाई खुद निकालता है (सेफ़्टी फ़ैक्टर 2.0 के लिए, 15 मीटर तक)।","कम से कम ज़रूरी ऊँचाई मिल जाती है।","वह ऊँचाई आपके शाफ़्ट से ज़्यादा हो सकती है।","आपकी असली दीवार की जाँच होती है।","ऊँचाई कम हो तो सिर्फ़ CHECK आता है; ऐप खुद बड़ी दीवार नहीं सुझाता।"],
["दीवार के ऊपर मिट्टी की गहराई","ज़मीन की सतह से बैक वॉल के ऊपरी किनारे तक की गहराई। दीवार सतह तक हो तो 0।","शाफ़्ट ड्रॉइंग (ज़मीन का लेवल और दीवार के ऊपर का लेवल) या साइट सर्वे।","3 मीटर","ऐप 3 मीटर मानता है।","जल्दी अंदाज़ा मिल जाता है।","असली गहराई अलग हो तो मिट्टी की ताकत ज़्यादा या कम आँकी जाएगी।","मिट्टी की ताकत सही निकलती है; गहराई ज़्यादा हो तो ताकत बढ़ती है।","1 मीटर से कम डालने पर ऊपर से मिट्टी उठने का ख़तरा है और चेतावनी आती है।"],
["मिट्टी का प्रकार","दीवार के पीछे की मिट्टी, जो दीवार को पीछे से रोकती है।","सॉइल रिपोर्ट (बोरहोल लॉग): घर्षण कोण φ, कोहेशन c, वज़न γ। मैनुअल पेज 43 के अनुसार लॉन्च वाले सिरे की मिट्टी सुधारी जाती है; रिपोर्ट में सुधार के बाद की वैल्यू हों तो वही लें।","सामान्य रेत; या 'अपनी वैल्यू' में φ = 30 डिग्री, c = 0 kPa, γ = 18 kN/m³।","सामान्य रेत (φ 30 डिग्री, γ 18 kN/m³) पहले से चुनी रहती है।","तुरंत हिसाब मिल जाता है।","अंदाज़े की मिट्टी असली से कमज़ोर निकले तो नतीजा असुरक्षित होगा, खासकर नरम चिकनी मिट्टी में।","नतीजा आपकी साइट की मिट्टी पर आधारित होता है।","सॉइल रिपोर्ट चाहिए; φ में छोटी गलती भी नतीजा काफ़ी बदल देती है।"],
["पानी की गहराई","ज़मीन की सतह से भूजल (ग्राउंडवाटर) तक की गहराई।","सॉइल रिपोर्ट या बोरहोल में पानी का लेवल। क्लाइंट के मेथड स्टेटमेंट में भी ग्राउंडवाटर डेटा माँगा गया है।","2.5 मीटर","पानी नहीं माना जाता; साथ में 'अगर पानी सतह तक हो' वाली जाँच दिखती है।","आसान है, और सबसे बुरे हाल की जाँच भी साथ मिलती है।","असल में पानी हो तो मिट्टी की ताकत दिखाई गई ताकत से कम होगी, यानी असुरक्षित।","पानी का असर हिसाब में आ जाता है।","पानी का लेवल मौसम से बदलता है; सबसे ऊँचा लेवल डालें।"],
["जैक प्लेट की साइड","वह चौकोर हिस्सा (बराबर का चौकोर) जिससे थ्रस्ट प्लेट या रिएक्शन ब्रैकेट दीवार को दबाता है। इसी से पंचिंग शियर और कंक्रीट बेयरिंग की जाँच होती है।","मशीन ड्रॉइंग (थ्रस्ट सिस्टम / रिएक्शन ब्रैकेट, DZ1811 पेज 8)। आयताकार हो तो चौड़ाई × ऊँचाई का वर्गमूल लें।","1.5 मीटर (ब्रैकेट लगभग 1.98 × 1.2 मीटर, वर्गमूल ≈ 1.5; जाँच लें)।","1.5 मीटर।","DZ1811 के करीब है, इसलिए जल्दी चलता है।","दूसरी मशीन की प्लेट अलग हो सकती है; छोटी प्लेट में मोटी दीवार चाहिए।","मोटाई और बेयरिंग सही आते हैं।","ड्रॉइंग गलत पढ़ने से मोटाई गलत आती है।"],
["कंक्रीट ग्रेड","दीवार के कंक्रीट की ताकत: M30, M35 या M40।","स्ट्रक्चरल डिज़ाइन, ड्रॉइंग के नोट्स या कंक्रीट मिक्स स्पेसिफ़िकेशन।","M35","M35 पहले से चुना रहता है।","तुरंत चलता है।","असली कंक्रीट कमज़ोर हो तो ज़रूरी मोटाई ज़्यादा होगी, पर ऐप कम दिखाएगा।","मोटाई सही आती है।","ऊँचा ग्रेड मोटाई घटाता है, पर कंक्रीट महँगा होता है।"],
["शाफ़्ट व्यास / अधिकतम दीवार चौड़ाई (वैकल्पिक)","गोल शाफ़्ट का व्यास, या शाफ़्ट में दीवार की ज़्यादा से ज़्यादा जितनी चौड़ाई आ सकती है। ऐप इसे चौड़ाई की ऊपरी सीमा मानता है।","शाफ़्ट ड्रॉइंग और क्लाइंट की हर ड्राइव की अलग शाफ़्ट ड्रॉइंग। हमारी ड्रॉइंग में गोल शाफ़्ट का व्यास 5000 मिलीमीटर है, स्प्लिट लॉन्चिंग।","5 मीटर (= 5000 मिलीमीटर)। बॉक्स 2 खाली हो तो ऐप इसी चौड़ाई के लिए ऊँचाई निकालता है; दीवार इससे चौड़ी हो तो चेतावनी देता है।","कोई सीमा नहीं; पहले जैसा व्यवहार।","कोई अतिरिक्त जानकारी नहीं चाहिए।","ऐप शाफ़्ट से चौड़ी दीवार सुझा सकता है।","नतीजा शाफ़्ट के अंदर रहता है और चौड़ाई ज़्यादा हो तो चेतावनी मिलती है।","गोल शाफ़्ट में रिएक्शन ब्रैकेट घुमावदार दीवार पर टिकता है, इसलिए पूरा व्यास काम की चौड़ाई नहीं है; असली प्रभावी चौड़ाई बॉक्स 2 में डालें।"]],
z:[["✔ PASS और CHECK का मतलब","हरा PASS: मिट्टी की ताकत जैक लोड की कम से कम 2.0 गुना है (सेफ़्टी फ़ैक्टर 2.0 या ज़्यादा)। पीला CHECK: सेफ़्टी फ़ैक्टर 1.5 से 2.0 के बीच हो तो सीमा के करीब; 1.5 से कम हो तो मिट्टी की ताकत कम है। दीवार बड़ी करें, गहराई बढ़ाएँ या मिट्टी सुधारें।"],["जाँच (Checks) की लाइनें","पंचिंग शियर: माँग ≤ क्षमता हो तो ✓, नहीं तो ✗ (मोटाई या प्लेट बड़ी करें)। कंक्रीट बेयरिंग: प्लेट के नीचे दबाव (MPa) ≤ सीमा हो तो ✓। अगर पानी सतह तक हो: पानी का बॉक्स खाली हो तो यह सबसे बुरे हाल की जाँच दिखती है, यानी पानी चढ़ जाए तो मिट्टी की क्षमता कितनी घटेगी और सेफ़्टी फ़ैक्टर क्या होगा।"],["दीवार के विकल्पों की तालिका","चौड़ाई और ऊँचाई दोनों खाली हों और बॉक्स 9 भी खाली हो, तब ऐप 3, 4, 5, 6 मीटर चौड़ाई के लिए सेफ़्टी फ़ैक्टर 2.0 देने वाली ऊँचाई और दीवार की तली का लेवल दिखाता है। 'सीमा से ज़्यादा' (15 मीटर से ज़्यादा) लिखा हो तो उस चौड़ाई पर 15 मीटर की दीवार भी काफ़ी नहीं।"]]},
en:{t:"📖 Quick guide: what to enter in each box",cp:"📋 Copy guide",e0:"Only box 1 is required; every other box can stay empty. For each box this guide says what it is, where to get it, an example, what the app uses if you leave it empty, and the advantage and disadvantage of leaving it empty versus typing it. Fill what you know and press CALCULATE. Use the unit button on the right inside each box to choose the unit.",i:[
["Max jacking force","The total maximum thrust the machine’s jacks can push with. This is the load the back wall must resist.","Machine specification sheet or operation manual (thrust force). Use the unit button in the box: Ton, kN or kip (1 Ton = 9.81 kN).","DZ1811 machine: 2 cylinders × 2000 kN = 4000 kN (about 408 Ton); manual page 28 (printed page 27); stroke 3000 Millimeter.","The box is required. Without it there is no calculation.","None.","No result at all.","The result is for your real machine.","Enter the rated maximum, not a lower working pressure value; a lower value gives false comfort."],
["Wall width","Width of the back wall, i.e. the part of the wall that presses on the soil from side to side.","Shaft drawing or the structural design of the shaft. In a circular shaft the full diameter is not a usable width (see box 9); on the machine drawing the reaction bracket is about 1980 Millimeter wide (2090 overall).","4 Meter","If box 9 is filled, the app uses it as the width. Otherwise: if height is also empty it shows options for 3, 4, 5, 6 Meter; if height is typed it calculates the width needed.","You immediately see which sizes work.","The width the app picks may not fit your shaft.","The result is for your real wall.","A wrong width gives a wrong factor of safety; you need the drawing."],
["Wall height","Vertical height of the back wall from bottom to top.","Shaft drawing and structural design (top and bottom level of the wall). The machine’s bracket is about 1.2 Meter high (my reading of the drawing, to verify); that is only the loaded part, not the whole wall.","3.5 Meter","The app solves the height needed for the width (for factor of safety 2.0, up to 15 Meter).","You get the smallest height that works.","That height may be more than your shaft allows.","Your real wall is checked.","If the height is too small you only get CHECK; the app does not enlarge the wall by itself."],
["Cover depth to wall top","Depth from the ground surface to the top edge of the back wall. Enter 0 if the wall reaches the surface.","Shaft drawing (ground level and wall-top level) or site survey.","3 Meter","The app assumes 3 Meter.","Quick estimate.","If the real depth differs, soil resistance is over- or under-estimated.","Soil resistance is accurate; more depth gives more resistance.","Under 1 Meter the soil may heave upward and a warning appears."],
["Soil type","The soil behind the wall that resists the wall’s push.","Soil report (borehole log): friction angle φ, cohesion c, unit weight γ. Manual page 43 says the soil at the launch end is improved; use the improved values if the report gives them.","Medium sand; or ‘Custom values’ with φ = 30 Degree, c = 0 kPa, γ = 18 kN/m³.","‘Medium sand’ (φ 30 Degree, γ 18 kN/m³) is pre-selected.","Instant calculation.","If the real soil is weaker than assumed the result is unsafe, especially in soft clay.","The result follows your site’s soil.","You need the soil report; a small error in φ changes the result a lot."],
["Water table depth","Depth from the ground surface to the groundwater level.","Soil report or water level in the boreholes. The client’s method statement also asks for groundwater data.","2.5 Meter","No water is assumed; the check ‘If the water table is at the surface’ is shown as a worst case.","Simple, and you still get the worst-case check.","If water really exists, soil resistance is lower than shown, which is unsafe.","The effect of water is included.","Water level changes with seasons; enter the highest level."],
["Jack plate side","Side of the equivalent square through which the thrust plate or reaction bracket presses on the wall. Punching shear and concrete bearing are checked from it.","Machine drawing (thrust system / reaction bracket, DZ1811 page 8). If it is a rectangle, take the square root of width × height.","1.5 Meter (bracket about 1.98 × 1.2 Meter, square root ≈ 1.5; to verify).","1.5 Meter.","Close to DZ1811, so it runs quickly.","Another machine’s plate may differ; a smaller plate needs a thicker wall.","Thickness and bearing are correct.","Misreading the drawing gives a wrong thickness."],
["Concrete grade","Strength of the wall concrete: M30, M35 or M40.","Structural design, drawing notes or the concrete mix specification.","M35","M35 is pre-selected.","Runs instantly.","If the real concrete is weaker, the needed thickness is larger than the app shows.","The thickness is correct.","A higher grade reduces thickness but concrete costs more."],
["Shaft diameter / max wall width (optional)","Diameter of the circular shaft, or the maximum wall width the shaft allows. The app treats it as the upper limit for the wall width.","Shaft drawing and the client’s drive-specific shaft drawing. In our drawing: circular shaft, diameter 5000 Millimeter, split launching.","5 Meter (= 5000 Millimeter). If box 2 is empty the app solves the height for this width; it warns if the wall is wider than this.","No limit; the app behaves as before.","No extra data needed.","The app may suggest a wall wider than the shaft.","Results stay inside the shaft and you get a warning if the width is exceeded.","In a circular shaft the reaction bracket bears on the curved wall, so the full diameter is not a usable width; enter the effective width in box 2."]],
z:[["✔ What PASS and CHECK mean","Green PASS: soil resistance is at least 2.0 times the jacking load (factor of safety 2.0 or more). Yellow CHECK: a factor of safety between 1.5 and 2.0 is marginal; below 1.5 the soil resistance is too low. Enlarge the wall, increase the depth or improve the ground."],["The Checks lines","Punching shear: ✓ if demand ≤ capacity, otherwise ✗ (increase thickness or plate size). Concrete bearing: ✓ if the stress under the plate (MPa) ≤ the limit. If the water table is at the surface: when the water box is empty this shows a worst case, i.e. how much the soil capacity drops and what the factor of safety becomes if water rises."],["The wall options table","When width, height and box 9 are all empty, the app shows, for widths of 3, 4, 5 and 6 Meter, the height that gives factor of safety 2.0 and the level of the wall bottom. ‘More than 15 Meter’ means even a 15 Meter wall is not enough at that width."]]},
ar:{t:"📖 دليل سريع: ماذا تُدخل في كل خانة",cp:"📋 نسخ الدليل",e0:"الخانة 1 فقط إلزامية؛ ويمكن ترك باقي الخانات فارغة. لكل خانة يوضح الدليل: ما هي، ومن أين تحصل عليها، ومثالاً، وما يستخدمه التطبيق إذا تُركت فارغة، وميزة وعيب ترك الخانة فارغة مقابل كتابة القيمة. املأ ما تعرفه ثم اضغط «احسب». اختر الوحدة من الزر الموجود داخل كل خانة.",i:[
["أقصى قوة دفع للمكابس","إجمالي أقصى قوة تدفع بها مكابس الماكينة، وهذا هو الحمل الذي يجب أن يتحمله الجدار الخلفي.","ورقة مواصفات الماكينة أو دليل التشغيل (قوة الدفع). اختر الوحدة من الزر داخل الخانة: طن أو kN أو كيب (1 طن = 9.81 kN).","ماكينة DZ1811: مكبسان × 2000 kN = 4000 kN (نحو 408 طن)؛ دليل التشغيل صفحة 28 (المطبوعة 27)؛ شوط المكبس 3000 ملليمتر.","الخانة إلزامية. بدونها لا يوجد حساب.","لا يوجد.","لا تظهر أي نتيجة.","النتيجة تخص ماكينتك الفعلية.","اكتب أقصى قدرة للمكابس وليس قيمة ضغط التشغيل الأقل؛ القيمة الأقل تعطي اطمئناناً كاذباً."],
["عرض الجدار","عرض الجدار الخلفي، أي الجزء الذي يضغط على التربة من جانب إلى جانب.","رسم العمود أو التصميم الإنشائي للعمود. في العمود الدائري لا يكون القطر كله عرضاً مفيداً (انظر الخانة 9)؛ وفي رسم الماكينة يبلغ عرض حامل رد الفعل نحو 1980 ملليمتر (2090 إجمالاً).","4 متر","إذا كانت الخانة 9 مملوءة يستخدمها التطبيق عرضاً. وإلا: إذا كان الارتفاع فارغاً أيضاً يعرض خيارات 3 و4 و5 و6 أمتار؛ وإذا كان الارتفاع مكتوباً يحسب العرض المطلوب.","تعرف فوراً أي المقاسات تصلح.","قد لا يناسب العرض الذي يختاره التطبيق عمودك.","النتيجة لجدارك الفعلي.","العرض الخاطئ يعطي معامل أمان خاطئاً؛ يلزم الرجوع إلى الرسم."],
["ارتفاع الجدار","الارتفاع الرأسي للجدار الخلفي من الأسفل إلى الأعلى.","رسم العمود والتصميم الإنشائي (منسوب أعلى الجدار وأسفله). حامل الماكينة بارتفاع نحو 1.2 متر (حسب قراءتي للرسم، يلزم التحقق) وهو الجزء المحمَّل فقط وليس الجدار كله.","3.5 متر","يحسب التطبيق الارتفاع المطلوب لهذا العرض (لمعامل أمان 2.0 وحتى 15 متراً).","تحصل على أقل ارتفاع مطلوب.","قد يزيد هذا الارتفاع عما يسمح به عمودك.","يُفحص جدارك الفعلي.","إذا كان الارتفاع صغيراً تظهر «تحقق» فقط، ولا يكبّر التطبيق الجدار تلقائياً."],
["عمق التغطية حتى أعلى الجدار","العمق من سطح الأرض إلى الحافة العلوية للجدار الخلفي. اكتب 0 إذا وصل الجدار إلى السطح.","رسم العمود (منسوب الأرض ومنسوب أعلى الجدار) أو المسح الموقعي.","3 متر","يفترض التطبيق 3 أمتار.","تقدير سريع.","إذا اختلف العمق الفعلي فقد تُقدَّر مقاومة التربة بأكثر أو بأقل من الحقيقة.","مقاومة التربة أدق؛ كلما زاد العمق زادت المقاومة.","أقل من 1 متر تظهر تحذيراً من ارتفاع التربة إلى الأعلى."],
["نوع التربة","التربة خلف الجدار التي تقاوم دفع الجدار.","تقرير التربة (سجل الحفر): زاوية الاحتكاك φ والتماسك c والوزن النوعي γ. وحسب دليل التشغيل صفحة 43 تُحسَّن التربة عند طرف الإطلاق، فاستخدم قيم ما بعد التحسين إن وردت في التقرير.","رمل متوسط؛ أو «قيم مخصصة»: φ = 30 درجة، c = 0 kPa، γ = 18 kN/m³.","«رمل متوسط» (φ 30 درجة، γ 18 kN/m³) مختار مسبقاً.","حساب فوري.","إذا كانت التربة الفعلية أضعف من المفترضة تصبح النتيجة غير آمنة، خاصة في الطين الناعم.","النتيجة مبنية على تربة موقعك.","يلزم تقرير التربة؛ وخطأ صغير في φ يغيّر النتيجة كثيراً."],
["عمق المياه الجوفية","العمق من سطح الأرض إلى منسوب المياه الجوفية.","تقرير التربة أو منسوب المياه في الحفر. وبيان الطريقة لدى العميل يطلب أيضاً بيانات المياه الجوفية.","2.5 متر","لا يفترض وجود مياه، ويعرض فحص «إذا كان منسوب المياه عند السطح» كأسوأ حالة.","بسيط، وتحصل أيضاً على فحص أسوأ حالة.","إذا وُجدت مياه فعلاً فستكون مقاومة التربة أقل من المعروض، أي غير آمنة.","يدخل أثر المياه في الحساب.","منسوب المياه يتغير مع الفصول؛ اكتب أعلى منسوب."],
["ضلع لوح المكبس","ضلع المربع المكافئ الذي يضغط به لوح الدفع أو حامل رد الفعل على الجدار؛ منه يُفحص القص الثاقب وتحمل الخرسانة.","رسم الماكينة (منظومة الدفع / حامل رد الفعل، DZ1811 صفحة 8). إذا كان مستطيلاً فخذ الجذر التربيعي لحاصل ضرب العرض × الارتفاع.","1.5 متر (الحامل نحو 1.98 × 1.2 متر، الجذر ≈ 1.5؛ يلزم التحقق).","1.5 متر.","قريب من DZ1811 فيسير الحساب بسرعة.","لوح ماكينة أخرى قد يختلف؛ واللوح الصغير يحتاج جداراً أسمك.","السماكة والتحمل أدق.","قراءة الرسم الخاطئة تعطي سماكة خاطئة."],
["رتبة الخرسانة","مقاومة خرسانة الجدار: M30 أو M35 أو M40.","التصميم الإنشائي أو ملاحظات الرسم أو مواصفات الخلطة الخرسانية.","M35","M35 مختارة مسبقاً.","يسير فوراً.","إذا كانت الخرسانة الفعلية أضعف فستكون السماكة المطلوبة أكبر مما يعرضه التطبيق.","السماكة صحيحة.","الرتبة الأعلى تقلل السماكة لكن الخرسانة أغلى."],
["قطر العمود / أقصى عرض للجدار (اختياري)","قطر العمود الدائري أو أقصى عرض يسمح به العمود للجدار. يعتبره التطبيق حداً أعلى لعرض الجدار.","رسم العمود، ورسم العمود الخاص بكل درايف لدى العميل. في رسمنا: عمود دائري قطره 5000 ملليمتر، إطلاق مقسوم.","5 متر (= 5000 ملليمتر). إذا كانت الخانة 2 فارغة يحسب التطبيق الارتفاع لهذا العرض، ويحذر إذا زاد عرض الجدار عنه.","لا حد؛ يعمل التطبيق كما كان.","لا حاجة إلى بيانات إضافية.","قد يقترح التطبيق جداراً أعرض من العمود.","تبقى النتائج داخل العمود مع تحذير عند زيادة العرض.","في العمود الدائري يستند حامل رد الفعل على جدار منحنٍ، فالقطر كله ليس عرضاً مفيداً؛ اكتب العرض الفعّال في الخانة 2."]],
z:[["✔ معنى «آمن» و«تحقق»","الأخضر «آمن»: مقاومة التربة لا تقل عن ضعف حمل المكابس (معامل الأمان 2.0 أو أكثر). الأصفر «تحقق»: معامل الأمان بين 1.5 و2.0 هامش ضيق، وأقل من 1.5 تكون مقاومة التربة منخفضة. كبّر الجدار أو زد العمق أو حسّن التربة."],["أسطر الفحوصات","القص الثاقب: ✓ إذا كان الحمل ≤ السعة وإلا ✗ (زد السماكة أو كبّر اللوح). تحمل الخرسانة: ✓ إذا كان الإجهاد تحت اللوح (MPa) ≤ الحد. إذا كان منسوب المياه عند السطح: عند ترك خانة المياه فارغة يعرض أسوأ حالة، أي مقدار انخفاض مقاومة التربة ومعامل الأمان لو ارتفعت المياه."],["جدول خيارات الجدار","إذا كان العرض والارتفاع فارغين والخانة 9 فارغة يعرض التطبيق، لكل عرض من 3 و4 و5 و6 أمتار، الارتفاع اللازم لمعامل أمان 2.0 ومنسوب قاع الجدار. وعبارة «أكثر من 15 متر» تعني أن جداراً بارتفاع 15 متراً لا يكفي لهذا العرض."]]}};
